<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="./Css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar  sm:navbar-expand bg-1 fg-2">
        <div class="container">
            <a href="#">Student Management System</a>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">Student Dashboard</h2>
        <div class="card">
            <div class="cardBody">
                <h4>Total Students</h4>
                <h2 id="totalStu">0</h2>
            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <h4>Add Student</h4>
            <form id="studentForm">
                <input type="text" id="studentName" class="form-controll mb-3" placeholder="Enter Name" required>
                <input type="text" id="studentCourse" class="form-controll mb-3" placeholder="Enter Course" required>
                <button class="btn btn-primary" type="submit">Add Student</button>
            </form>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="Js/script.js"></script>
</body>
</html>
